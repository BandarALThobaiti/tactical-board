<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tactical Board</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>
<body>
    <header>
        <div class="brand">
        <div class="brand-icon">
            <img src="assets/Logo.svg" alt="Tactical Board Logo" style="width: 100%; height: 100%;">
        </div>
            <div class="brand-title">Tactical Board</div>
        </div>
        <div class="header-actions">

            <button class="btn btn-danger" id="btnClearDrawings">Clear Drawings</button>
            <button class="btn" id="btnResetAll">Reset All</button>
            <button class="btn btn-primary" id="btnExport">Export Image (PNG)</button>
        </div>
    </header>

    <div class="app-container">

        <aside class="sidebar">

            <div class="control-group">
                <div class="section-title">Pitch Mode</div>
                <div class="toggle-group">
                    <button class="toggle-btn active" id="btnVSOn">11 vs 11</button>
                    <button class="toggle-btn" id="btnVSOff">11 vs 0</button>
                </div>
            </div>

            <div class="control-group">
                <div class="section-title">Formations</div>
                <div style="display: flex; flex-direction: column; gap: 0.6rem;">


                <div>
                <label style="font-size: 0.75rem; color: var(--text-muted); display: block; margin-bottom: 0.2rem;">Home Team (Blue):</label>
                <div class="custom-select" id="selectHomeFormation" data-value="4-3-3">
    <button type="button" class="custom-select-trigger">4-3-3</button>
    <div class="custom-select-options">
        <div class="custom-select-option" data-value="4-3-3">4-3-3</div>
        <div class="custom-select-option" data-value="4-2-3-1">4-2-3-1</div>
        <div class="custom-select-option" data-value="4-4-2">4-4-2</div>
        <div class="custom-select-option" data-value="3-5-2">3-5-2</div>
        <div class="custom-select-option" data-value="4-1-4-1">4-1-4-1</div>
        <div class="custom-select-option" data-value="5-3-2">5-3-2</div>
    </div>
</div>
            </div>

            <div id="awayFormationWrapper">
                        <label style="font-size: 0.75rem; color: var(--text-muted); display: block; margin-bottom: 0.2rem;">Away Team (Red):</label>
                        <div class="custom-select" id="selectAwayFormation" data-value="4-3-3">
    <button type="button" class="custom-select-trigger">4-3-3</button>
    <div class="custom-select-options">
        <div class="custom-select-option" data-value="4-3-3">4-3-3</div>
        <div class="custom-select-option" data-value="4-2-3-1">4-2-3-1</div>
        <div class="custom-select-option" data-value="4-4-2">4-4-2</div>
        <div class="custom-select-option" data-value="3-5-2">3-5-2</div>
        <div class="custom-select-option" data-value="4-1-4-1">4-1-4-1</div>
        <div class="custom-select-option" data-value="5-3-2">5-3-2</div>
    </div>
</div>
                    </div>
                </div>
            </div>

            <div class="control-group">
                <div class="section-title">Drawing Tools</div>
                <div class="tools-grid">
                    <button class="tool-btn active" data-tool="select">
                        <svg viewBox="0 0 24 24"><path d= "m7 2l12 11.2-5.8.5 3.3 7.3-2.2 1-3.2-7.4L7 19V2z"/></svg>
                        move
                    </button>
                    <button class="tool-btn" data-tool="arrow">
                        <svg viewBox="0 0 24 24"><path d="M5 13h11.86l-5.43 1.42 1.42L21.14 12l-8.29-8.29-1.42 1.42L16.86 11H5v2z"/></svg>
                        Run
                    </button>
                    <button class="tool-btn" data-tool="pass">
                        <svg viewBox="0 0 24 24"><path d="M2 11h4v2H2zm6 0h4v2H8zm6 0h4v2h-4zm6 0h2v2h-2z"/></svg>
                        pass
                    </button>
                    <button class="tool-btn" data-tool="dribble">
                        <svg viewBox="0 0 24 24"><path d="M2 13c2 0 2-2 4-2s2 2 4 2 2-2 4-2 2 2 4 2 2-2 4-2v-2c-2 0-2 2-4 2s-2-2-4-2-2 2-4 2-2-2-4-2-2 2-4 2z"/></svg>
                        Dribble
                    </button> 
                    <button class="tool-btn" data-tool="area">
                        <svg viewBox="0 0 24 24"><path d="M3 3h18v18H3V3zm2 2v14h14V5H5z"/></svg>
                        Zone
                    </button>
                    <button class="tool-btn" data-tool="eraser">
                        <svg viewBox="0 0 24 24"><path d="M16.24 3.56l4.95 4.94c.78.79.78 2.05 0 2.84L12 20.53a4.008 4.008 0 01-5.66 0L2.81 17c-.78-.79-.78-2.05 0-2.84l10.6-10.6c.79-.78 2.05-.78 2.83 0z"/></svg>
                        Eraser
                    </button>
                </div>
                
                <div class="color-picker">
                    <div class="color-dot active" style="background: #ffffff;" data-color="#ffffff"></div>
                    <div class="color-dot" style="background: #eab308;" data-color="#eab308"></div>
                    <div class="color-dot" style="background: #ef4444;" data-color="#ef4444"></div>
                    <div class="color-dot" style="background: #38bdf8;" data-color="#38bdf8"></div>
                </div>
            </div>

            <div class="control-group" style="flex: 1;">
                <div class="section-title">Tactical Notes</div>
                <textarea id="tacticalNotes" placeholder="Write tactical instructions and key notes here..."></textarea>
            </div>

        </aside>

        <main class="workspace">
            <div class="canvas-container" id="canvasContainer">
                <canvas id="pitchCanvas"></canvas>
            </div>
        </main>
    </div>

    <div class="modal" id="playerModal">
        <div class="modal-content">
            <div class="modal-header">Edit player Details</div>
            <div>
                <label style="font-size: 0.75rem; color: var(--text-muted);">player Number</label>
                <input type="text" id="modalPlayerNumber" maxlength="3">
            </div>
            <div>
                <label style="font-size: 0.75rem; color: var(--text-muted);">player Name / Role</label>
                <input type="text" id="modalPlayerName" maxlength="12">
            </div>
            <div class="modal-footer">
                <button class="btn" id="btnCancelModal">Cancel</button>
                <button class="btn btn-primary" id="btnSaveModal">Save changes</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
